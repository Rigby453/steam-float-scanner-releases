name: Continue the exact retained Scanner 1.2.14 candidate

# Publish this candidate AS .github/workflows/build-release-request.yml.
# The old release-request trigger is replaced: this workflow cannot rebuild it.
on:
  push:
    branches: [main]
    paths: ['release-continuations/1.2.14.json']

permissions:
  contents: read

concurrency:
  group: scanner-release-request-1.2.14
  cancel-in-progress: false

env:
  NODE_OPTIONS: ''
  NODE_PATH: ''

jobs:
  windows:
    if: github.repository == 'Rigby453/steam-float-scanner-releases' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SFS_NETWORK_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify reviewed no-key orchestration and unchanged signer
        working-directory: trusted
        shell: pwsh
        run: |
          if ((Get-FileHash -LiteralPath tools/release-request.mjs -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92b3dc82f05fcfc8e1fe202705ba5a50f344f425c864b8e5f9bd81a7c1d91079') { throw 'REQUEST_HELPER_HASH_MISMATCH' }
          if ((Get-FileHash -LiteralPath tools/sign-release.mjs -Algorithm SHA256).Hash.ToLowerInvariant() -ne '12088d415fc8553ee0a7491d1457813c2c42204121ca1f20b5a9d866b532c38a') { throw 'SIGNER_HASH_MISMATCH' }
          if ((Get-FileHash -LiteralPath tools/continue-release-request.mjs -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e7db72497fbc70bbc715d854674e76bdb22184dca6b46606d8644738d3f00cdc') { throw 'CONTINUATION_HELPER_HASH_MISMATCH' }
          node --test tools/continue-release-request.test.mjs tools/sign-release.test.mjs tools/purchase-admission.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read and verify only the fixed original failed-run candidate artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node trusted/tools/continue-release-request.mjs download trusted "$env:RUNNER_TEMP/scanner-retained-original.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize unchanged reviewed source without rebuilding its installer
        shell: pwsh
        run: |
          node trusted/tools/release-request.mjs prepare trusted "$env:RUNNER_TEMP/scanner-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Use a fresh canonical temporary directory for awaited native children
        shell: pwsh
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'scanner-child-temp'
          New-Item -ItemType Directory -Path $p -ErrorAction Stop | Out-Null
          $r = (Resolve-Path -LiteralPath $p).Path
          "TEMP=$r" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$r" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore locked dependencies without lifecycle scripts
        working-directory: ${{ runner.temp }}/scanner-source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all original payload bytes and await actual packaged financial proof
        shell: pwsh
        run: |
          node trusted/tools/continue-release-request.mjs recover trusted "$env:RUNNER_TEMP/scanner-source" "$env:RUNNER_TEMP/scanner-retained-original.zip" "$env:RUNNER_TEMP/scanner-original-payload" "$env:RUNNER_TEMP/scanner-release-bundle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanner-native-request-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-release-bundle/
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: windows
    if: github.repository == 'Rigby453/steam-float-scanner-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    concurrency:
      group: official-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools
            release-requests/1.2.14.json
            release-continuations/1.2.14.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scanner-native-request-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-release-bundle
      - name: Verify trusted staging code before receiving a write token
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '92b3dc82f05fcfc8e1fe202705ba5a50f344f425c864b8e5f9bd81a7c1d91079  tools/release-request.mjs' | sha256sum --check --strict
          printf '%s\n' '12088d415fc8553ee0a7491d1457813c2c42204121ca1f20b5a9d866b532c38a  tools/sign-release.mjs' | sha256sum --check --strict
          printf '%s\n' 'e7db72497fbc70bbc715d854674e76bdb22184dca6b46606d8644738d3f00cdc  tools/continue-release-request.mjs' | sha256sum --check --strict
          node --test tools/continue-release-request.test.mjs tools/sign-release.test.mjs tools/purchase-admission.test.mjs
      - name: Stage only the verified original bytes and dispatch the unchanged protected signer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '92b3dc82f05fcfc8e1fe202705ba5a50f344f425c864b8e5f9bd81a7c1d91079  tools/release-request.mjs' | sha256sum --check --strict
          printf '%s\n' '12088d415fc8553ee0a7491d1457813c2c42204121ca1f20b5a9d866b532c38a  tools/sign-release.mjs' | sha256sum --check --strict
          node tools/release-request.mjs stage . "$RUNNER_TEMP/scanner-release-bundle"
