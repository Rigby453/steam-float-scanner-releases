name: Sign and publish verified Scanner release
run-name: ${{ inputs.operation == 'admit-purchase-policy' && format('Admit SFS purchase policy for {0} (draft {1})', inputs.version, inputs.release_id) || inputs.operation == 'renew-purchase-policy' && format('Renew SFS purchase policy for {0}', inputs.version) || format('Publish SFS {0} (draft {1})', inputs.version, inputs.release_id) }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a reviewed release, admit its purchase module only, or renew existing admissions
        type: choice
        default: release
        options:
          - release
          - admit-purchase-policy
          - renew-purchase-policy
      release_id:
        description: Existing draft ID (release or admission)
        type: string
      version:
        description: Draft version (release) or expected current stable version (renewal)
        required: true
        type: string
      source_commit:
        description: Exact 40-character reviewed source commit (release or admission)
        type: string
      source_record_sha256:
        description: Exact SHA256 of release-source.json in the draft (release or admission)
        type: string
      previous_policy_sha256:
        description: SHA256 of the current public protocol.json after review (renewal only)
        type: string

permissions:
  contents: read

concurrency:
  group: official-release-publication
  cancel-in-progress: false

env:
  SFS_OPERATION: ${{ inputs.operation }}
  SFS_PREVIOUS_POLICY_SHA256: ${{ inputs.previous_policy_sha256 }}
  SFS_RELEASE_ID: ${{ inputs.release_id }}
  SFS_VERSION: ${{ inputs.version }}
  SFS_SOURCE_COMMIT: ${{ inputs.source_commit }}
  SFS_REQUEST_SHA256: ${{ inputs.source_record_sha256 }}
  NODE_OPTIONS: ''
  NODE_PATH: ''

jobs:
  verify:
    if: github.repository == 'Rigby453/steam-float-scanner-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # GitHub requires write access to read an unpublished draft release.
    # This job still has no release-signing environment or signing secrets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools
      - name: Verify pinned trusted code
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '7d7d0c211f3a71bc89b44092239861ba3e105545ce9f2ae01cd0dd1313bc34d0  tools/sign-release.mjs' | sha256sum --check --strict
          node --test tools/sign-release.test.mjs tools/purchase-admission.test.mjs
      - name: Verify exact release or renewal inputs without signing secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/sign-release.mjs verify

  publish:
    needs: verify
    if: github.repository == 'Rigby453/steam-float-scanner-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools
      - name: Sign and publish verified update or policy renewal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SFS_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.SFS_UPDATE_PRIVATE_KEY_PEM }}
          SFS_UPDATE_KEY_PASSPHRASE: ${{ secrets.SFS_UPDATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s\n' '7d7d0c211f3a71bc89b44092239861ba3e105545ce9f2ae01cd0dd1313bc34d0  tools/sign-release.mjs' | sha256sum --check --strict
          node tools/sign-release.mjs publish
